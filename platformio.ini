; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	duinowitchery/hd44780 @ ^1.3.2
	adafruit/DHT sensor library@^1.4.6
	sciosense/ScioSense_ENS16x @ ^2.0.5
	https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.2
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DUART_LCD_MIRROR=1
	-DCONFIG_BT_ENABLED=1
	-I src/Bluetooth      ;Flaga -I (duże i) oznacza "Include Path"
	-I include/Bluetooth
extra_scripts = pre:scripts/generate_alarm_melodies.py