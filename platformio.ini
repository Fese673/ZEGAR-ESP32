; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
build_dir = .pio
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	duinowitchery/hd44780 @ ^1.3.2
	sciosense/ScioSense_ENS16x @ ^2.0.5
	https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.2
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21
	plerup/EspSoftwareSerial @ ^8.2.0
upload_speed = 921600
board_build.partitions = huge_app.csv

build_flags = 

	;---- Open-Meteo weather (comment out to disable) ----
	-DMETEO_ENABLED
	;---- Debugging and telemetry flags ----
	-DCORE_DEBUG_LEVEL=2
	-DENABLE_WIFI_DIAGNOSTICS=1
	-DENABLE_RUNTIME_TELEMETRY=1
	-DRUNTIME_TELEMETRY_PRINT_INTERVAL_MS=5000UL
	-DESP_TO_GUTION_LOG_ENABLED=1
	;---- RAM TESTING FLAGS ----
	-DTEST_RAM=1
	-DRAM_TELEMETRY_PRINT_INTERVAL_MS=5000UL
	-DTEST_RAM_HEAP_INFO=0
	-DUART_LCD_MIRROR=1
	-DBOOT_LCD_CLEAR_TELEMETRY=1  
	-DCONFIG_BT_ENABLED=1
	-I src/bluetooth      ;Flaga -I (duże i) oznacza "Include Path"
	-I include/bluetooth
	-I include/core
	-I include/core/app
	-I include/core/services
	-I include/core/telemetry
	-I include/ui
	-I include/display
	-I include/comms
	-I include/sensors
	-I include/audio
	-I include/games
	-I include/input
	-I include/drivers
	-I include/config
	; Optional secret injection (preferred for CI/local private builds):
	; -DPROJECT_WIFI_SSID=\"your-ssid\"
	; -DPROJECT_WIFI_PASS=\"your-password\"
	; -DPROJECT_MQTT_BROKER=\"your-broker\"
	; -DPROJECT_MQTT_USERNAME=\"your-user\"
	; -DPROJECT_MQTT_PASSWORD=\"your-pass\"
extra_scripts = pre:scripts/generate_alarm_melodies.py